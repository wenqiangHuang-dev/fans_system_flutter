workflows:
  ios_unsigned_check:
    name: iOS unsigned check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.example.mobileClient
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          find ios -name "*.xcscheme" -print
      - name: Install Flutter dependencies
        script: |
          flutter pub get
          flutter precache --ios
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  ios_release_ipa:
    name: iOS release ipa
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          find ios -name "*.xcscheme" -print
      - name: Install Flutter dependencies
        script: |
          flutter pub get
          flutter precache --ios
      - name: Set up code signing settings
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build signed ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
